name: orionai-discord

services:
  orionai-discord:
    build: .
    image: orionai-discord:latest
    container_name: orionai-discord
    restart: unless-stopped
    # So o essencial: o resto usa o padrao de app/config.py. Para mexer em outra variavel
    # do .env.example, acrescente a linha aqui.
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # Busca no SearXNG da stack e leitura de paginas no proprio bot (sem fastCRW).
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      # Vazio = padrao de app/config.py.
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-}
      VISION_MODEL: ${VISION_MODEL:-}
      # Ultimo recurso da cadeia: Gemini no Google AI Studio. Vazio = desligado.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Donos do bot: todas as permissoes e sem limite de uso.
      OWNER_IDS: ${OWNER_IDS:-}
      ADMIN_ROLES: ${ADMIN_ROLES:-}
      # Nomes que acordam o bot sem @.
      BOT_NAMES: ${BOT_NAMES:-}
      COMMAND_PREFIX: ${COMMAND_PREFIX:-}
      TIMEZONE: ${TIMEZONE:-}
      # false = bot mudo em DM.
      DM_ENABLED: ${DM_ENABLED:-}
    volumes:
      - ./data:/app/data
    depends_on:
      - searxng
    x-casaos:
      envs:
        - container: DISCORD_TOKEN
          description:
            en_us: Discord bot token
        - container: OPENROUTER_API_KEY
          description:
            en_us: OpenRouter API key
        - container: GOOGLE_API_KEY
          description:
            en_us: Google AI Studio key (optional last-resort fallback)
        - container: OWNER_IDS
          description:
            en_us: Bot owner Discord user ids
        - container: BOT_NAMES
          description:
            en_us: Comma-separated names that wake the bot without an @mention
        - container: TIMEZONE
          description:
            en_us: Timezone used so the bot knows the current date/time
      volumes:
        - container: /app/data
          description:
            en_us: Persistent SQLite memory storage
      main: orionai-discord
      description:
        en_us: Discord bot with free AI via OpenRouter and per-channel persistent memory
      tagline:
        en_us: Discord AI bot
      title:
        en_us: OrionAI
      category: Utilities
      port_map: ""

  # Busca propria do bot (web_search). So o bot enxerga: sem `ports`, fica na rede
  # interna da stack. O settings.yml e gerado pelo searxng-init porque o SearXNG vem
  # com o formato json desligado e o bot precisa dele.
  searxng-init:
    image: alpine:3
    restart: "no"
    command:
      - sh
      - -c
      - |
        SECRET=$$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
        cat > /cfg/settings.yml <<EOF
        use_default_settings: true
        server:
          secret_key: "$$SECRET"
          limiter: false
          image_proxy: false
        search:
          formats:
            - html
            - json
        EOF
    volumes:
      - searxng-config:/cfg

  searxng:
    image: searxng/searxng:latest
    container_name: orionai-searxng
    restart: unless-stopped
    depends_on:
      searxng-init:
        condition: service_completed_successfully
    volumes:
      - searxng-config:/etc/searxng
    mem_limit: 512m

volumes:
  searxng-config:
