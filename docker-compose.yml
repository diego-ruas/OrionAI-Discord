name: orionai-discord

services:
  orionai-discord:
    build: .
    image: orionai-discord:latest
    container_name: orionai-discord
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      CRW_API_KEY: ${CRW_API_KEY:-}
      # Busca no SearXNG da stack e leitura de paginas no proprio bot (sem fastCRW). Para
      # usar o fastCRW, tire os servicos searxng* e esta variavel do compose.
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      # Vazio = padrao de app/config.py (fonte unica dos defaults de modelo).
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      VISION_MODEL: ${VISION_MODEL:-}
      OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-}
      VISION_MAX_IMAGE_PX: ${VISION_MAX_IMAGE_PX:-1024}
      VISION_JPEG_QUALITY: ${VISION_JPEG_QUALITY:-85}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_LANGS: ${OCR_LANGS:-por+eng}
      OCR_MIN_CHARS: ${OCR_MIN_CHARS:-24}
      OCR_SKIPS_VISION: ${OCR_SKIPS_VISION:-true}
      VISION_ENABLED: ${VISION_ENABLED:-true}
      VISION_DESCRIBE_ONLY: ${VISION_DESCRIBE_ONLY:-true}
      VISION_API_BASE: ${VISION_API_BASE:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      MEMORY_MAX_MESSAGES: ${MEMORY_MAX_MESSAGES:-}
      MAX_REPLY_CHARS: ${MAX_REPLY_CHARS:-}
      MAX_FACTS_PER_CHANNEL: ${MAX_FACTS_PER_CHANNEL:-}
      MAX_FACTS_PER_AUTHOR: ${MAX_FACTS_PER_AUTHOR:-}
      AMBIENT_CONTEXT_MESSAGES: ${AMBIENT_CONTEXT_MESSAGES:-12}
      SPLIT_REPLIES: ${SPLIT_REPLIES:-true}
      MAX_REPLY_MESSAGES: ${MAX_REPLY_MESSAGES:-3}
      TYPING_CHARS_PER_SECOND: ${TYPING_CHARS_PER_SECOND:-28}
      MAX_TYPING_DELAY_SECONDS: ${MAX_TYPING_DELAY_SECONDS:-}
      RATE_LIMIT_MESSAGES: ${RATE_LIMIT_MESSAGES:-}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-}
      COMMAND_PREFIX: ${COMMAND_PREFIX:-o!}
      ADMIN_ROLES: ${ADMIN_ROLES:-}
      BOT_NAMES: ${BOT_NAMES:-orionai,orion}
      FOLLOWUP_WINDOW_SECONDS: ${FOLLOWUP_WINDOW_SECONDS:-15}
      PRESENCE: ${PRESENCE:-listening:{prefix}ajuda|watching:{guilds} servidores}
      PRESENCE_ROTATE_SECONDS: ${PRESENCE_ROTATE_SECONDS:-180}
      PRESENCE_STATUS: ${PRESENCE_STATUS:-online}
      TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-Voce conversa com as pessoas de um servidor do Discord. Responda em portugues, num tom leve e bem-humorado, como alguem que e boa companhia no chat e por acaso tambem sabe das coisas. Va direto ao ponto - evite texto em excesso quando uma resposta curta resolve; quando o assunto exigir mais detalhe, de o detalhe, usando paragrafos curtos em vez de um bloco unico de texto.}
    volumes:
      - ./data:/app/data
    depends_on:
      - searxng
    x-casaos:
      envs:
        - container: DISCORD_TOKEN
          description:
            en_us: Discord bot token
        - container: OPENROUTER_API_KEY
          description:
            en_us: OpenRouter API key
        - container: CRW_API_KEY
          description:
            en_us: fastCRW API key (optional, used for web_search/fetch_page tools)
        - container: BOT_NAMES
          description:
            en_us: Comma-separated names that wake the bot without an @mention
        - container: TIMEZONE
          description:
            en_us: Timezone used so the bot knows the current date/time
      volumes:
        - container: /app/data
          description:
            en_us: Persistent SQLite memory storage
      main: orionai-discord
      description:
        en_us: Discord bot with free AI via OpenRouter and per-channel persistent memory
      tagline:
        en_us: Discord AI bot
      title:
        en_us: OrionAI
      category: Utilities
      port_map: ""

  # Busca propria do bot (web_search). So o bot enxerga: sem `ports`, fica na rede
  # interna da stack. O settings.yml e gerado pelo searxng-init porque o SearXNG vem
  # com o formato json desligado e o bot precisa dele.
  searxng-init:
    image: alpine:3
    restart: "no"
    command:
      - sh
      - -c
      - |
        SECRET=$$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
        cat > /cfg/settings.yml <<EOF
        use_default_settings: true
        server:
          secret_key: "$$SECRET"
          limiter: false
          image_proxy: false
        search:
          formats:
            - html
            - json
        EOF
    volumes:
      - searxng-config:/cfg

  searxng:
    image: searxng/searxng:latest
    container_name: orionai-searxng
    restart: unless-stopped
    depends_on:
      searxng-init:
        condition: service_completed_successfully
    volumes:
      - searxng-config:/etc/searxng
    mem_limit: 512m

volumes:
  searxng-config:
