name: novo-bot-roberto

services:
  novo-bot-roberto:
    build: .
    image: novo-bot-roberto:latest
    container_name: novo-bot-roberto
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      CRW_API_KEY: ${CRW_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-tencent/hy3:free}
      OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-google/gemma-4-26b-a4b-it:free}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-}
      MEMORY_MAX_MESSAGES: ${MEMORY_MAX_MESSAGES:-20}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-Voce e um assistente profissional em um servidor do Discord. Responda em portugues, com tom cordial, objetivo e preciso. Priorize clareza e correcao sobre informalidade, evite girias e emojis desnecessarios, e seja conciso sem omitir informacoes relevantes.}
    volumes:
      - ./data:/app/data
    x-casaos:
      envs:
        - container: DISCORD_TOKEN
          description:
            en_us: Discord bot token
        - container: OPENROUTER_API_KEY
          description:
            en_us: OpenRouter API key
        - container: CRW_API_KEY
          description:
            en_us: fastCRW API key (optional, used for web_search/fetch_page tools)
      volumes:
        - container: /app/data
          description:
            en_us: Persistent SQLite memory storage
      main: novo-bot-roberto
      description:
        en_us: Discord bot with free AI via OpenRouter and per-user persistent memory
      tagline:
        en_us: Discord AI bot
      title:
        en_us: Novo Bot Roberto
      category: Utilities
      port_map: ""
